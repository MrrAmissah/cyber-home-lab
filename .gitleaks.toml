# gitleaks configuration: extend the default ruleset and allow lab placeholders.
[extend]
useDefault = true

[allowlist]
description = "Lab placeholders and documentation values"
regexes = [
  '''EXAMPLE_[A-Z_]+''',
  '''changeme''',
  '''192\.0\.2\.\d+''',
  '''198\.51\.100\.\d+''',
  '''203\.0\.113\.\d+''',
]
